<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>MotivaEdu v6.4 — Oficial</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --azul-escuro: #1E3A8A;
            --azul-claro: #3B82F6;
            --ouro: #FBBF24;
            --fogo: #FF4500;
            --branco: #FFFFFF;
            --cinza-fundo: #F3F4F6;
            --texto: #1F2937;
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--cinza-fundo); color: var(--texto); padding-bottom: 100px; }

        /* --- HEADER --- */
        header { background: var(--azul-escuro); color: white; padding: 25px 20px; border-radius: 0 0 30px 30px; position: sticky; top: 0; z-index: 1000; }
        .nav-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .streak-container { display: flex; align-items: center; gap: 5px; background: rgba(255,255,255,0.2); padding: 5px 12px; border-radius: 20px; font-weight: bold; color: var(--ouro); }
        .streak-off { filter: grayscale(1); opacity: 0.5; }

        .xp-bar-bg { background: rgba(255,255,255,0.2); height: 8px; border-radius: 10px; margin-top: 15px; }
        #xp-bar-fill { background: var(--ouro); height: 100%; width: 0%; border-radius: 10px; transition: 1s; }

        /* --- CONTEÚDO --- */
        .container { padding: 20px; max-width: 600px; margin: auto; }
        .section { display: none; }
        .active { display: block; animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { background: white; border-radius: 20px; padding: 18px; margin-bottom: 12px; box-shadow: var(--card-shadow); border: 1px solid #eee; }
        .mission-row { display: flex; justify-content: space-between; align-items: center; }
        
        .btn-acao { background: var(--azul-claro); color: white; border: none; padding: 10px 18px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .btn-acao:disabled { background: #ccc; cursor: not-allowed; }

        /* --- NAVBAR CORRIGIDA (ALINHADA) --- */
        nav { 
            position: fixed; 
            bottom: 0; 
            left: 0;
            width: 100%; 
            background: white; 
            display: flex; 
            flex-direction: row; 
            justify-content: space-around; 
            align-items: center; 
            padding: 12px 0; 
            border-top: 1px solid #ddd; 
            z-index: 1000; 
        }

        .nav-item { 
            text-align: center; 
            color: #94A3B8; 
            cursor: pointer; 
            font-size: 11px; 
            font-weight: bold; 
            flex: 1; 
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .nav-item.active { color: var(--azul-claro); }
        .nav-item i { font-style: normal; font-size: 22px; }

        /* --- LOGIN --- */
        #login-screen { position: fixed; inset: 0; background: var(--azul-escuro); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-box { background: white; padding: 30px; border-radius: 25px; width: 100%; max-width: 380px; text-align: center; }
        select, input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #ddd; outline: none; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h2 style="color: var(--azul-escuro)">🚀 MotivaEdu</h2>
        <p style="font-size:12px; color:#666; margin-bottom:15px">Sistema de Gamificação</p>
        <input type="text" id="log-nome" placeholder="Seu Nome Completo">
        <select id="log-turma">
            <optgroup label="1º Ano">
                <option value="1º Ano A">1º Ano A</option>
                <option value="1º Ano B">1º Ano B</option>
            </optgroup>
            <optgroup label="2º Ano">
                <option value="2º Ano A">2º Ano A</option>
                <option value="2º Ano B">2º Ano B</option>
            </optgroup>
            <optgroup label="3º Ano">
                <option value="3º Ano A">3º Ano A</option>
                <option value="3º Ano B">3º Ano B</option>
            </optgroup>
        </select>
        <button class="btn-acao" style="width:100%; margin-top:10px" onclick="entrar()">Acessar</button>
    </div>
</div>

<header id="h-app" style="display:none">
    <div class="nav-top">
        <span id="disp-nome" style="font-weight:bold">Aluno</span>
        <div id="streak-fogo" class="streak-container streak-off">
            🔥 <span id="u-streak">0</span>
        </div>
    </div>
    <div style="font-size:12px; opacity:0.8">Nível <span id="u-lvl">1</span></div>
    <div class="xp-bar-bg"><div id="xp-bar-fill"></div></div>
    <div style="display:flex; justify-content:space-between; margin-top:10px; font-size:12px">
        <span>⭐ <span id="u-coins">0</span> EduCoins</span>
        <span>🎯 <span id="u-xp">0</span> XP</span>
    </div>
</header>

<div class="container" id="c-app" style="display:none">
    <div id="tab-missoes" class="section active">
        <h3 style="margin-bottom: 15px;">🎯 Missões</h3>
        <div id="lista-missoes"></div>
    </div>

    <div id="tab-ranking" class="section">
        <h3>🏆 Ranking</h3>
        <div id="rank-lista" style="margin-top:15px"></div>
    </div>

    <div id="tab-prof" class="section">
        <h3>👨‍🏫 Painel do Professor</h3>
        <div id="prof-lista" style="margin-top:15px"></div>
    </div>
</div>

<nav id="n-app" style="display:none">
    <div class="nav-item active" onclick="aba('tab-missoes', this)"><i>🎯</i><span>Missões</span></div>
    <div class="nav-item" onclick="aba('tab-ranking', this)"><i>🏆</i><span>Ranking</span></div>
    <div class="nav-item" onclick="verificarMestre()"><i>👨‍🏫</i><span>Mestre</span></div>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, get, onValue, update, push, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDbgGlHjrLc1mHUgJqX3MHLDv3EyZ4mtww",
        authDomain: "motivaedu-2d472.firebaseapp.com",
        databaseURL: "https://motivaedu-2d472-default-rtdb.firebaseio.com",
        projectId: "motivaedu-2d472",
        storageBucket: "motivaedu-2d472.firebasestorage.app",
        messagingSenderId: "885043141539",
        appId: "1:885043141539:web:d9411ffb112e8f71a91816"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let u = null;

    const missoesDisp = [
        { t: "Chegar no horário", xp: 10, c: 2 },
        { t: "Participar da aula", xp: 20, c: 5 },
        { t: "Lição de Casa", xp: 30, c: 10 },
        { t: "Ajudar o Professor", xp: 40, c: 15 },
        { t: "Organizar a sala", xp: 15, c: 5 },
        { t: "Desafio Extra", xp: 100, c: 20 }
    ];

    window.entrar = async () => {
        const nome = document.getElementById('log-nome').value.trim();
        const turma = document.getElementById('log-turma').value;
        if(!nome) return alert("Digite seu nome!");

        const id = nome.toLowerCase().replace(/\s/g, '_');
        const uRef = ref(db, 'v64_users/' + id);
        const snap = await get(uRef);

        if(snap.exists()) u = snap.val();
        else {
            u = { id, nome, turma, xp: 0, coins: 0, streak: 0, lastDate: "" };
            await set(uRef, u);
        }

        document.getElementById('login-screen').style.display = 'none';
        ['h-app','c-app','n-app'].forEach(id => document.getElementById(id).style.display = 'flex');
        if (id === 'c-app') document.getElementById(id).style.display = 'block';

        iniciarApp();
    };

    function iniciarApp() {
        onValue(ref(db, 'v64_users/' + u.id), snap => {
            const d = snap.val();
            document.getElementById('disp-nome').innerText = d.nome;
            document.getElementById('u-xp').innerText = d.xp;
            document.getElementById('u-coins').innerText = d.coins || 0;
            document.getElementById('u-lvl').innerText = Math.floor(d.xp / 500) + 1;
            document.getElementById('xp-bar-fill').style.width = (d.xp % 500 / 5) + "%";
            
            const foguinho = document.getElementById('u-streak');
            foguinho.innerText = d.streak || 0;
            if(d.streak > 0) document.getElementById('streak-fogo').classList.remove('streak-off');
            else document.getElementById('streak-fogo').classList.add('streak-off');
        });

        document.getElementById('lista-missoes').innerHTML = missoesDisp.map(m => `
            <div class="card mission-row">
                <div><b>${m.t}</b><br><small>+${m.xp} XP</small></div>
                <button class="btn-acao" onclick="pedir('${m.t}', ${m.xp}, ${m.c}, this)">Fiz!</button>
            </div>
        `).join('');

        syncRanking();
        syncMestre();
    }

    window.pedir = (t, xp, c, btn) => {
        push(ref(db, 'v64_pedidos'), { uid: u.id, nome: u.nome, t, xp, c, turma: u.turma });
        btn.innerText = "⏳"; btn.disabled = true;
    };

    function syncMestre() {
        onValue(ref(db, 'v64_pedidos'), snap => {
            const data = snap.val();
            let h = "";
            for(let k in data) {
                h += `<div class="card mission-row">
                    <div><b>${data[k].nome}</b><br>${data[k].t}</div>
                    <button class="btn-acao" onclick="aprovar('${k}','${data[k].uid}',${data[k].xp},${data[k].c})">✔</button>
                </div>`;
            }
            document.getElementById('prof-lista').innerHTML = h || "Sem pendências.";
        });
    }

    window.aprovar = async (key, uid, xp, c) => {
        const uRef = ref(db, 'v64_users/' + uid);
        const s = await get(uRef);
        const user = s.val();

        const hoje = new Date().toLocaleDateString();
        let novoStreak = user.streak || 0;
        if(user.lastDate !== hoje) {
            novoStreak++;
        }

        await update(uRef, { 
            xp: user.xp + xp, 
            coins: (user.coins || 0) + c,
            streak: novoStreak,
            lastDate: hoje
        });
        await remove(ref(db, 'v64_pedidos/' + key));
        confetti();
    };

    function syncRanking() {
        onValue(ref(db, 'v64_users'), snap => {
            const list = Object.values(snap.val() || {}).sort((a,b) => b.xp - a.xp);
            document.getElementById('rank-lista').innerHTML = list.map((u,i) => `
                <div class="card mission-row">
                    <span>${i+1}º ${u.nome}</span>
                    <b>${u.xp} XP</b>
                </div>
            `).join('');
        });
    }

    window.aba = (id, el) => {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
    };

    window.verificarMestre = () => {
        if(prompt("PIN:") === "1234") aba('tab-prof', document.querySelectorAll('.nav-item')[2]);
    };
</script>
</body>
</html>
