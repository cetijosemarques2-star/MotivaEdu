<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>MotivaEdu Pro - Níveis e Ranking</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <style>
        :root { --primary: #6C63FF; --secondary: #4F8CFF; --bg: #f5f7ff; --card: #fff; --text: #333; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 80px; }

        /* HEADER HUD */
        header { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; padding: 25px; border-radius: 0 0 30px 30px; }
        .progress-container { background: rgba(255,255,255,0.2); height: 10px; border-radius: 5px; margin-top: 10px; overflow: hidden; }
        #progress-fill { background: white; height: 100%; width: 0%; transition: 0.5s; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 12px; margin-top: 5px; }
        .bronze { background: #CD7F32; } .prata { background: #C0C0C0; color: #333; } .ouro { background: #FFD700; color: #333; } .diamante { background: #B9F2FF; color: #333; }

        .container { padding: 20px; max-width: 600px; margin: auto; }
        .section { display: none; }
        .active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* LISTAS E CARDS */
        .card { background: var(--card); border-radius: 15px; padding: 15px; margin-bottom: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
        .rank-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #eee; }
        .btn-xp { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 10px; cursor: pointer; }

        /* NAV */
        nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 15px; border-top: 1px solid #ddd; }
        .nav-icon { font-size: 20px; cursor: pointer; filter: grayscale(1); }
        .nav-icon.active { filter: grayscale(0); transform: scale(1.2); }

        /* LOGIN */
        #login-screen { position: fixed; inset: 0; background: var(--primary); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .login-card { background: white; padding: 30px; border-radius: 20px; width: 90%; text-align: center; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-card">
        <h2>Entrar no MotivaEdu</h2>
        <input type="text" id="nomeUser" placeholder="Seu nome">
        <select id="turmaUser">
            <option value="9A">9º Ano A</option>
            <option value="9B">9º Ano B</option>
            <option value="1A">1º Médio A</option>
        </select>
        <button class="btn-xp" style="width: 100%" onclick="login()">Começar Jornada</button>
    </div>
</div>

<header>
    <div style="display:flex; justify-content:space-between">
        <h3 id="displayNome">Usuário</h3>
        <div id="displayNivel" class="badge bronze">Bronze</div>
    </div>
    <div class="progress-container"><div id="progress-fill"></div></div>
    <p style="font-size: 12px; margin-top: 5px">XP Total: <span id="displayXP">0</span></p>
</header>

<div class="container">
    <div id="aba-desafios" class="section active">
        <h3>🎯 Missões</h3>
        <div id="lista-desafios"></div>
    </div>

    <div id="aba-ranking" class="section">
        <h3>🏆 Ranking</h3>
        <div style="display:flex; gap:10px; margin:15px 0">
            <button onclick="carregarRanking('global')" class="btn-xp" style="font-size:12px">Global</button>
            <button onclick="carregarRanking('turma')" class="btn-xp" style="font-size:12px; background:#4F8CFF">Minha Turma</button>
        </div>
        <div class="card" id="lista-ranking" style="display:block">
            Carregando...
        </div>
    </div>
</div>

<nav>
    <div class="nav-icon active" onclick="mudarAba('aba-desafios', this)">🎯</div>
    <div class="nav-icon" onclick="mudarAba('aba-ranking', this)">🏆</div>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, get, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDbgGlHjrLc1mHUgJqX3MHLDv3EyZ4mtww",
        authDomain: "motivaedu-2d472.firebaseapp.com",
        databaseURL: "https://motivaedu-2d472-default-rtdb.firebaseio.com",
        projectId: "motivaedu-2d472",
        storageBucket: "motivaedu-2d472.firebasestorage.app",
        messagingSenderId: "885043141539",
        appId: "1:885043141539:web:d9411ffb112e8f71a91816"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let usuario = { nome: "", turma: "", xp: 0 };

    // 50 Desafios Simplificados
    const desafios = [
        { t: "Ler 1 livro", xp: 50 }, { t: "Ajudar colega", xp: 30 }, { t: "Tarefa em dia", xp: 20 },
        { t: "Chegar no horário", xp: 10 }, { t: "Mesa limpa", xp: 5 }, { t: "Fazer perguntas", xp: 15 },
        { t: "Resumo da aula", xp: 25 }, { t: "Praticar esporte", xp: 20 }, { t: "Beber água", xp: 5 },
        { t: "Sem celular na aula", xp: 30 } // Adicione mais conforme desejar...
    ];

    window.login = async () => {
        const nome = document.getElementById('nomeUser').value;
        const turma = document.getElementById('turmaUser').value;
        if(!nome) return;

        const id = nome.replace(/\s/g, '_').toLowerCase();
        const snap = await get(ref(db, 'users/' + id));
        
        if(snap.exists()){
            usuario = snap.val();
        } else {
            usuario = { nome, turma, xp: 0 };
            await set(ref(db, 'users/' + id), usuario);
        }

        document.getElementById('login-screen').style.display = 'none';
        atualizarInterface();
        renderDesafios();
        carregarRanking('global');
    };

    function atualizarInterface() {
        document.getElementById('displayNome').innerText = usuario.nome;
        document.getElementById('displayXP').innerText = usuario.xp;
        
        let nivel = "Bronze", classe = "bronze", pct = (usuario.xp/200)*100;
        if(usuario.xp > 1000) { nivel = "Diamante"; classe = "diamante"; pct = 100; }
        else if(usuario.xp > 500) { nivel = "Ouro"; classe = "ouro"; pct = (usuario.xp/1000)*100; }
        else if(usuario.xp > 200) { nivel = "Prata"; classe = "prata"; pct = (usuario.xp/500)*100; }

        const dNivel = document.getElementById('displayNivel');
        dNivel.innerText = nivel;
        dNivel.className = "badge " + classe;
        document.getElementById('progress-fill').style.width = pct + "%";
    }

    window.addXP = (valor, btn) => {
        usuario.xp += valor;
        const id = usuario.nome.replace(/\s/g, '_').toLowerCase();
        update(ref(db, 'users/' + id), { xp: usuario.xp });
        atualizarInterface();
        btn.innerText = "✅"; btn.disabled = true;
        confetti({ particleCount: 100, spread: 70 });
    };

    function renderDesafios() {
        const list = document.getElementById('lista-desafios');
        list.innerHTML = desafios.map(d => `
            <div class="card">
                <span>${d.t}</span>
                <button class="btn-xp" onclick="addXP(${d.xp}, this)">+${d.xp} XP</button>
            </div>
        `).join('');
    }

    window.carregarRanking = (tipo) => {
        onValue(ref(db, 'users'), (snap) => {
            let dados = snap.val();
            let lista = Object.values(dados);
            if(tipo === 'turma') lista = lista.filter(u => u.turma === usuario.turma);
            
            lista.sort((a,b) => b.xp - a.xp);
            document.getElementById('lista-ranking').innerHTML = lista.map((u, i) => `
                <div class="rank-item">
                    <span>${i+1}º ${u.nome} <small>(${u.turma})</small></span>
                    <strong>${u.xp} XP</strong>
                </div>
            `).join('');
        });
    };

    window.mudarAba = (id, el) => {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-icon').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
    }
</script>
</body>
</html>
