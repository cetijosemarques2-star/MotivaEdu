<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>MotivaEdu Pro - 50 Desafios</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <style>
        :root { --primary: #6C63FF; --secondary: #4F8CFF; --bg: #f5f7ff; --card-bg: #ffffff; --text: #333; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 80px; }

        header { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; padding: 25px; border-radius: 0 0 30px 30px; text-align: center; }
        .container { padding: 20px; max-width: 800px; margin: auto; }
        
        .card { background: var(--card-bg); border-radius: 15px; padding: 15px; margin-bottom: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
        .challenge-info { flex: 1; }
        .challenge-info h4 { font-size: 14px; margin-bottom: 4px; }
        .challenge-info span { font-size: 12px; color: #666; background: #eee; padding: 2px 8px; border-radius: 10px; }
        
        .btn-xp { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; min-width: 80px; }
        .btn-xp:disabled { background: #ccc; }

        .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .filter-btn { background: white; border: 1px solid var(--primary); padding: 5px 15px; border-radius: 20px; cursor: pointer; white-space: nowrap; }
        
        #login-screen { position: fixed; inset: 0; background: var(--primary); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .login-box { background: white; padding: 30px; border-radius: 20px; width: 90%; max-width: 350px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h2>MotivaEdu</h2>
        <input type="text" id="userNome" placeholder="Seu nome">
        <button class="btn-xp" style="width: 100%" onclick="entrar()">Entrar</button>
    </div>
</div>

<header>
    <h2 id="welcomeName">Olá!</h2>
    <p>XP Total: <span id="xpDisplay">0</span></p>
</header>

<div class="container">
    <h3>🚀 Missões e Desafios</h3>
    <div class="filter-bar">
        <button class="filter-btn" onclick="renderChallenges('Todos')">Todos</button>
        <button class="filter-btn" onclick="renderChallenges('Estudo')">Estudo</button>
        <button class="filter-btn" onclick="renderChallenges('Social')">Social</button>
        <button class="filter-btn" onclick="renderChallenges('Hábito')">Hábitos</button>
    </div>
    <div id="lista-desafios"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, update, onValue, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDbgGlHjrLc1mHUgJqX3MHLDv3EyZ4mtww",
        authDomain: "motivaedu-2d472.firebaseapp.com",
        databaseURL: "https://motivaedu-2d472-default-rtdb.firebaseio.com",
        projectId: "motivaedu-2d472",
        storageBucket: "motivaedu-2d472.firebasestorage.app",
        messagingSenderId: "885043141539",
        appId: "1:885043141539:web:d9411ffb112e8f71a91816"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const desafiosBase = [
        { t: "Ler 10 páginas de um livro", xp: 20, c: "Estudo" },
        { t: "Ajudar um colega com dúvida", xp: 30, c: "Social" },
        { t: "Entregar tarefa no prazo", xp: 25, c: "Estudo" },
        { t: "Manter a mesa organizada", xp: 10, c: "Hábito" },
        { t: "Participar da aula ativamente", xp: 15, c: "Estudo" },
        { t: "Chegar no horário", xp: 10, c: "Hábito" },
        { t: "Fazer um resumo da aula", xp: 20, c: "Estudo" },
        { t: "Pedir desculpas por um erro", xp: 40, c: "Social" },
        { t: "Recolher lixo do chão", xp: 15, c: "Social" },
        { t: "Usar palavras gentis", xp: 10, c: "Social" },
        { t: "Praticar esporte por 30min", xp: 25, c: "Hábito" },
        { t: "Beber 2L de água no dia", xp: 10, c: "Hábito" },
        { t: "Estudar 1h extra", xp: 35, c: "Estudo" },
        { t: "Apresentar trabalho sem ler", xp: 50, c: "Estudo" },
        { t: "Organizar mochila", xp: 10, c: "Hábito" },
        { t: "Compartilhar material", xp: 20, c: "Social" },
        { t: "Elogiar um professor", xp: 15, c: "Social" },
        { t: "Não usar celular na aula", xp: 20, c: "Hábito" },
        { t: "Fazer perguntas inteligentes", xp: 15, c: "Estudo" },
        { t: "Resolver desafio de lógica", xp: 30, c: "Estudo" },
        { t: "Ensinar algo novo a alguém", xp: 40, c: "Social" },
        { t: "Frequência 100% na semana", xp: 100, c: "Hábito" },
        { t: "Liderar um grupo", xp: 45, c: "Social" },
        { t: "Ajudar na limpeza da sala", xp: 30, c: "Social" },
        { t: "Ler notícia e comentar", xp: 15, c: "Estudo" },
        { t: "Trazer lanche saudável", xp: 10, c: "Hábito" },
        { t: "Dormir 8h na noite anterior", xp: 20, c: "Hábito" },
        { t: "Resolver conflito sem briga", xp: 50, c: "Social" },
        { t: "Fazer caligrafia", xp: 15, c: "Estudo" },
        { t: "Organizar biblioteca da sala", xp: 40, c: "Social" },
        { t: "Criar mapa mental", xp: 25, c: "Estudo" },
        { t: "Trazer curiosidade científica", xp: 20, c: "Estudo" },
        { t: "Respeitar fila da cantina", xp: 10, c: "Social" },
        { t: "Não faltar na prova", xp: 30, c: "Hábito" },
        { t: "Ajudar aluno novo", xp: 50, c: "Social" },
        { t: "Participar de olimpíada", xp: 80, c: "Estudo" },
        { t: "Ganhar medalha", xp: 200, c: "Estudo" },
        { t: "Escrever poema ou conto", xp: 30, c: "Estudo" },
        { t: "Ter o caderno completo", xp: 40, c: "Estudo" },
        { t: "Consertar algo quebrado", xp: 30, c: "Social" },
        { t: "Ser voluntário em evento", xp: 60, c: "Social" },
        { t: "Praticar um idioma", xp: 25, c: "Estudo" },
        { t: "Melhorar nota em 1 ponto", xp: 50, c: "Estudo" },
        { t: "Não levar ocorrência", xp: 70, c: "Hábito" },
        { t: "Sugerir melhoria para escola", xp: 40, c: "Social" },
        { t: "Fazer curso online extra", xp: 100, c: "Estudo" },
        { t: "Cuidar de uma planta", xp: 20, c: "Hábito" },
        { t: "Fazer apresentação visual", xp: 30, c: "Estudo" },
        { t: "Terminar prova primeiro", xp: 10, c: "Estudo" },
        { t: "Ajudar na organização do pátio", xp: 25, c: "Social" }
    ];

    let userKey = "";
    let xpTotal = 0;

    window.entrar = async () => {
        const nome = document.getElementById('userNome').value;
        if(!nome) return;
        userKey = nome.replace(/\s/g, '_').toLowerCase();
        
        const snapshot = await get(ref(db, 'users/' + userKey));
        if(snapshot.exists()){
            xpTotal = snapshot.val().xp;
        } else {
            await set(ref(db, 'users/' + userKey), { nome, xp: 0 });
        }
        
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('welcomeName').innerText = "Olá, " + nome;
        document.getElementById('xpDisplay').innerText = xpTotal;
        renderChallenges('Todos');
    };

    window.renderChallenges = (filtro) => {
        const container = document.getElementById('lista-desafios');
        container.innerHTML = "";
        desafiosBase.forEach((d, index) => {
            if(filtro !== 'Todos' && d.c !== filtro) return;
            
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="challenge-info">
                    <h4>${d.t}</h4>
                    <span>${d.c}</span>
                </div>
                <button class="btn-xp" onclick="completar(${index}, ${d.xp}, this)">+${d.xp} XP</button>
            `;
            container.appendChild(card);
        });
    };

    window.completar = (id, xp, btn) => {
        xpTotal += xp;
        document.getElementById('xpDisplay').innerText = xpTotal;
        update(ref(db, 'users/' + userKey), { xp: xpTotal });
        
        btn.innerText = "✅";
        btn.disabled = true;
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
    };

</script>
</body>
</html>
