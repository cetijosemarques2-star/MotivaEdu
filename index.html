<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>MotivaEdu v6 — Season 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #1E3A8A 0%, #6D28D9 50%, #3B82F6 100%);
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --gold: #FBBF24;
            --text-light: #F3F4F6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            background: var(--primary-gradient); 
            background-attachment: fixed;
            color: var(--text-light);
            min-height: 100vh;
            padding-bottom: 100px;
        }

        /* --- GLASSMORPHISM CARDS --- */
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        /* --- HEADER DASHBOARD --- */
        header { padding: 40px 20px 20px; }
        .season-badge {
            background: var(--gold);
            color: #1e1e1e;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .user-info { display: flex; align-items: center; gap: 15px; margin-top: 15px; }
        .avatar-wrapper {
            position: relative;
            width: 70px; height: 70px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(to right, #FBBF24, #F59E0B); /* Moldura Rara */
        }
        .avatar-img { width: 100%; height: 100%; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; }

        /* --- DASHBOARD GRID --- */
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .stat-item { text-align: center; }
        .stat-value { font-size: 18px; font-weight: 800; display: block; }
        .stat-label { font-size: 10px; opacity: 0.7; text-transform: uppercase; }

        /* --- RANKING PÓDIO --- */
        .podium-container {
            display: flex; justify-content: space-around; align-items: flex-end;
            padding: 40px 0 20px;
        }
        .podium-player { text-align: center; position: relative; }
        .p-rank {
            width: 50px; border-radius: 12px 12px 0 0;
            display: flex; align-items: center; justify-content: center; font-weight: bold;
        }
        .rank-1 { height: 70px; background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(251, 191, 36, 0.4); }
        .rank-2 { height: 50px; background: #E5E7EB; color: #000; }
        .rank-3 { height: 35px; background: #94A3B8; color: #000; }

        /* --- SISTEMA DE CASAS --- */
        .house-tag {
            padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: bold;
            margin-top: 4px; display: inline-block;
        }
        .house-dragao { background: #EF4444; color: white; }
        .house-lobo { background: #6366F1; color: white; }

        /* --- NAVIGATION --- */
        nav {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            display: flex; justify-content: space-around; padding: 15px;
            z-index: 1000;
        }
        .nav-btn { color: white; text-decoration: none; font-size: 20px; opacity: 0.5; }
        .nav-btn.active { opacity: 1; transform: scale(1.2); color: var(--gold); }

        /* --- BOTÕES --- */
        .btn-claim {
            background: white; color: #1E3A8A; border: none;
            padding: 10px 20px; border-radius: 14px;
            font-weight: 800; font-size: 12px; cursor: pointer;
        }

        .section { display: none; }
        .active-section { display: block; animation: scaleUp 0.3s ease; }
        @keyframes scaleUp { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

    </style>
</head>
<body>

<header>
    <span class="season-badge">Temporada Olimpíadas 2026</span>
    <div class="user-info">
        <div class="avatar-wrapper">
            <div class="avatar-img">🦁</div>
        </div>
        <div>
            <h2 id="display-nome">Gusttavo</h2>
            <span class="house-tag house-lobo">Equipe Lobo</span>
        </div>
    </div>

    <div class="dashboard-grid">
        <div class="glass-card stat-item">
            <span class="stat-value">#12</span>
            <span class="stat-label">Ranking</span>
        </div>
        <div class="glass-card stat-item">
            <span class="stat-value">🔥 7</span>
            <span class="stat-label">Streak</span>
        </div>
    </div>
</header>

<div class="container" style="padding: 0 20px;">
    
    <div id="sec-dash" class="section active-section">
        <h3 style="margin-bottom: 15px;">Missões Ativas</h3>
        <div class="glass-card" style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <p style="font-weight: 600;">Desafio de Matemática</p>
                <small style="opacity: 0.7;">+150 XP | Temporada</small>
            </div>
            <button class="btn-claim" onclick="completarMissao(150)">Fiz!</button>
        </div>

        <div class="glass-card">
            <p style="font-size: 14px; font-weight: 600; margin-bottom: 10px;">Progresso de Nível</p>
            <div style="background: rgba(255,255,255,0.1); height: 8px; border-radius: 10px;">
                <div id="progress-bar" style="background: var(--gold); width: 65%; height: 100%; border-radius: 10px; box-shadow: 0 0 15px var(--gold);"></div>
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 8px; font-size: 10px;">
                <span>3.200 XP</span>
                <span>4.000 XP</span>
            </div>
        </div>
    </div>

    <div id="sec-rank" class="section">
        <div class="podium-container">
            <div class="podium-player">
                <div class="avatar-img" style="width: 40px; height: 40px; font-size: 20px; margin: auto;">🦊</div>
                <div class="p-rank rank-2">2º</div>
                <small>Ana</small>
            </div>
            <div class="podium-player">
                <div class="avatar-img" style="width: 50px; height: 50px; font-size: 25px; border: 2px solid var(--gold); margin: auto;">🦁</div>
                <div class="p-rank rank-1">1º</div>
                <small>João</small>
            </div>
            <div class="podium-player">
                <div class="avatar-img" style="width: 40px; height: 40px; font-size: 20px; margin: auto;">🦅</div>
                <div class="p-rank rank-3">3º</div>
                <small>Bia</small>
            </div>
        </div>
        
        <div class="glass-card" style="padding: 10px;">
            <div style="display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid var(--glass-border);">
                <span>#4 Carlos</span>
                <span>2.850 XP</span>
            </div>
            <div style="display: flex; justify-content: space-between; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 12px;">
                <span>#12 Gusttavo (Você)</span>
                <span>1.420 XP</span>
            </div>
        </div>
    </div>
</div>

<nav>
    <a href="#" class="nav-btn active" onclick="showSec('sec-dash', this)">🏠</a>
    <a href="#" class="nav-btn" onclick="showSec('sec-rank', this)">🏆</a>
    <a href="#" class="nav-btn">🛡️</a>
    <a href="#" class="nav-btn">🤖</a>
</nav>

<script>
    function showSec(id, btn) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active-section'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active-section');
        btn.classList.add('active');
    }

    function completarMissao(xp) {
        confetti({
            particleCount: 100,
            spread: 70,
            origin: { y: 0.6 },
            colors: ['#FBBF24', '#3B82F6', '#FFFFFF']
        });
        alert("Missão enviada para aprovação do professor! 🔥");
    }
</script>

</body>
</html>
